<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Heartwood: a tree cross-section with a solid core">
  <title>Heartwood</title>
  <!--
    A trunk in cross-section. The outer growth rings are open and thin
    (sapwood); the core is solid (heartwood). Hollow-LLM's claim is that the
    trunk can be empty. The mark is the counter-claim.
  -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- sapwood: open rings, thinning outward -->
    <circle cx="32" cy="32" r="29" stroke-width="1.5" opacity=".22"
            stroke-dasharray="128 34" transform="rotate(-24 32 32)"/>
    <circle cx="32" cy="32" r="24" stroke-width="1.75" opacity=".34"
            stroke-dasharray="104 30" transform="rotate(66 32 32)"/>
    <circle cx="32" cy="32" r="19" stroke-width="2" opacity=".52"
            stroke-dasharray="86 22" transform="rotate(160 32 32)"/>
    <circle cx="32" cy="32" r="14.5" stroke-width="2.25" opacity=".72"
            stroke-dasharray="70 18" transform="rotate(-100 32 32)"/>
  </g>
  <!-- heartwood: the solid core -->
  <circle cx="32" cy="32" r="9" fill="currentColor"/>
</svg>
